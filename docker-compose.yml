services:

  db:
    image: postgres:latest
    container_name: videoflix_database
    environment:
      POSTGRES_DB: ${DB_NAME:-videoflix_db}
      POSTGRES_USER: ${DB_USER:-videoflix_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-supersecretpassword}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-videoflix_user} -d ${DB_NAME:-videoflix_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:latest
    container_name: videoflix_redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: backend.Dockerfile
    env_file:
      - path: .env
        required: false
    container_name: videoflix_backend
    volumes:
      - .:/app
      - videoflix_media:/app/media
      - videoflix_static:/app/static
    environment:
      - PYTHONUNBUFFERED=1
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-videoflix_db}
      - DB_USER=${DB_USER:-videoflix_user}
      - DB_PASSWORD=${DB_PASSWORD:-supersecretpassword}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_LOCATION=${REDIS_LOCATION:-redis://redis:6379/1}
      - SECRET_KEY=${SECRET_KEY:-django-insecure-lp6h18zq4@z30symy*oz)+hp^uoti48r_ix^qc-m@&yfxd7&hn}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: videoflix_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../frontend:/var/www/frontend:ro
      - videoflix_static:/var/www/static:ro
      - videoflix_media:/var/www/media:ro
    depends_on:
      - web


volumes:
  postgres_data:
  redis_data:
  videoflix_media:
  videoflix_static:
