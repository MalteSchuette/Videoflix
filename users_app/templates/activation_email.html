<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin:0;padding:0;background-color:#f4f4f4;font-family:Arial,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f4;padding:40px 0;">
    <tr>
      <td align="center">
        <table width="560" cellpadding="0" cellspacing="0" style="background-color:#ffffff;border-radius:8px;overflow:hidden;">
          <tr>
            <td align="center" style="padding:32px 40px 24px;">
              <img src="cid:logo" width="200" alt="Videoflix" style="display:block;">
            </td>
          </tr>
          <tr>
            <td style="padding:0 40px 40px;">
              <p style="margin:0 0 8px;color:#000000;font-size:15px;line-height:1.6;">
                Dear <span style="color:#3547FF;">{{ username }},</span>
              </p>
              <p style="margin:0 0 28px;color:#000000;font-size:15px;line-height:1.6;">
                Thank you for registering with <span style="color:#3547FF;">Videoflix</span>.
                To complete your registration and verify your email address, please click the link below:
              </p>
              <a href="{{ activation_url }}" style="display:inline-block;background-color:#3547FF;color:#ffffff;text-decoration:none;font-size:15px;font-weight:bold;padding:14px 32px;border-radius:30px;">Activate account</a>
              <p style="margin:28px 0 0;color:#000000;font-size:15px;line-height:1.6;">
                If you did not create an account with us, please disregard this email.
              </p>
              <p style="margin:20px 0 4px;color:#000000;font-size:15px;">Best regards,</p>
              <p style="margin:0;color:#000000;font-size:15px;">Your Videoflix Team.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
